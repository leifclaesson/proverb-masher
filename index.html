<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>COOKIE — mashed-up proverbs</title>
<meta name="description" content="A proverb masher from 1996: real proverbs chopped in half and glued back wrong, in Swedish, English, Thai, Russian, Dutch, Greek, Polish and French. Grammar right, meaning mangled.">
<style>
  /* ============================================================
     COOKIE.BAS (Liket of Goto10, ~1996) -- the web port.
     DOS/CRT look; the proverb line is the PROTECTED element:
     it wraps and shrinks via clamp() but never clips or drops.
     Yield order on small windows: banner, footer, then nothing.
     ============================================================ */
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #050505;
    --fg: #d8d8d8;
    --dim: #8a8a8a;
    --bright: #ffe14d;          /* BASIC COLOR 14 */
    --accent: #ffb000;          /* amber phosphor */
    --mono: Consolas, "Cascadia Mono", "Courier New", monospace;
    /* Thai must render in a proper Thai font -- never the fake-retro mono */
    --thai: "Leelawadee UI", "Noto Sans Thai", Thonburi, sans-serif;
  }

  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--mono);
    display: flex;
    flex-direction: column;
    min-height: 100dvh;
    overflow-x: hidden;
  }

  /* CRT dressing: vignette + scanlines, purely decorative overlays */
  body::before {
    content: "";
    position: fixed; inset: 0;
    background: radial-gradient(ellipse at center,
                transparent 55%, rgba(0,0,0,.55) 100%);
    pointer-events: none;
    z-index: 3;
  }
  body::after {
    content: "";
    position: fixed; inset: 0;
    background: repeating-linear-gradient(
      to bottom, transparent 0 2px, rgba(0,0,0,.22) 2px 3px);
    pointer-events: none;
    z-index: 4;
    animation: flicker 4s infinite;
  }
  @keyframes flicker {
    0%, 100% { opacity: 1; }
    92%      { opacity: 1; }
    93%      { opacity: .82; }
    94%      { opacity: 1; }
  }
  /* Only the full-screen scanline flicker yields to reduce-motion. The cursor
     blink does NOT: people set that flag to kill window transitions, not to ask
     a DOS terminal to stop being one, and a hardware cursor that doesn't blink
     is just broken. Same reasoning as the type-on (see typeOn below). */
  @media (prefers-reduced-motion: reduce) {
    body::after { animation: none; }
  }

  /* --- top bar: controls pinned to the TOP so they never shift
         under the cursor when lines differ in length (the 1996
         tkinter edition's rule, kept) --- */
  header {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: .6rem .9rem;
    padding: clamp(.5rem, 2vmin, 1.1rem);
    z-index: 5;
  }
  .langs { display: flex; gap: .45rem; flex-wrap: wrap; justify-content: center; }
  button {
    font-family: var(--mono);
    font-size: clamp(.85rem, 2.6vmin, 1.05rem);
    background: transparent;
    color: var(--fg);
    border: 1px solid var(--dim);
    padding: .5em .8em;
    min-height: 44px;
    cursor: pointer;
    text-shadow: 0 0 6px rgba(216,216,216,.35);
  }
  /* Any chrome holding Thai script gets the real Thai font, never the
     fake-retro mono: the language button always, and the "one more" button +
     tagline whenever Thai is the active language (setLang stamps lang= on
     them). Scoped per element, because <html lang> gets rewritten to "th" on
     a language switch and must NOT re-font the whole latin UI. */
  button[lang="th"], #tagline[lang="th"],
  #homeLink[lang="th"], #readmeLink[lang="th"] { font-family: var(--thai); }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button.active, #more:active {
    background: var(--accent);
    color: #000;
    border-color: var(--accent);
    text-shadow: none;
  }
  #more {
    color: var(--bright);
    border-color: var(--bright);
    font-weight: bold;
  }
  #more:hover { background: var(--bright); color: #000; text-shadow: none; }
  /* the autocycle checkbox: armed state is a colour shift, NOT the filled
     .active look -- that one belongs to the selected language and shouldn't
     read as "this is the current thing" on a toggle sitting next to it */
  #auto[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); }

  /* --- banner: first to shed on short windows --- */
  #banner {
    text-align: center;
    color: var(--dim);
    font-size: clamp(.7rem, 2.2vmin, .95rem);
    padding: 0 1rem;
    text-shadow: 0 0 5px rgba(138,138,138,.4);
  }

  /* --- the proverb: the protected element --- */
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(.6rem, 2.5vmin, 1.4rem);
    padding: clamp(.8rem, 3vmin, 2rem);
    overflow-y: auto;
    min-height: 0;
  }
  /* Both text blocks are FIXED-WIDTH boxes rather than shrink-to-fit ones: the
     typing code measures against their width before a character exists, so that
     width may not depend on what's currently in them. position:relative anchors
     the hidden probe each one measures with. */
  #proverb, #mirror { position: relative; width: 100%; }
  #proverb {
    max-width: 21ch;
    font-size: clamp(1.25rem, 5.5vmin, 2.6rem);
    line-height: 1.45;
    color: var(--bright);
    text-shadow: 0 0 10px rgba(255,225,77,.5), 0 0 2px rgba(255,225,77,.9);
  }
  #proverb.thai {
    font-family: var(--thai);
    line-height: 1.7;
  }
  /* One .ln per line of the FINISHED text, all of them in place before the
     first keystroke -- see the surface comment in the script. white-space:pre
     because the breaks are already decided; nothing here may re-wrap. The line
     is placed by its own left padding, NOT by text-align:center, which would
     re-centre it on every keystroke and slide the words leftwards as they're
     typed. An empty div generates no line box at all, hence the zero-width
     inline-block: it summons the strut, so the block stands at its full final
     height while its lines are still empty and nothing moves down the page. */
  .ln { white-space: pre; }
  .ln::before { content: ""; display: inline-block; width: 0; }
  .probe {
    position: absolute; top: 0; left: 0;
    visibility: hidden;          /* still has layout -- display:none would not */
    pointer-events: none;
    overflow-wrap: break-word;
  }
  /* the DOS hardware cursor: a thick blinking underscore at the bottom
     of the character cell, not a solid block */
  #cursor {
    display: inline-block;
    width: 1ch;
    height: .13em;
    margin-left: .15ch;
    background: var(--bright);
    box-shadow: 0 0 8px rgba(255,225,77,.7);
    vertical-align: -0.24em;   /* the bottom scanlines of the cell, below the baseline */
    animation: blink 1.06s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  #mirror {
    max-width: 60ch;
    color: var(--dim);
    font-style: italic;
    font-size: clamp(.85rem, 3vmin, 1.15rem);
    line-height: 1.5;
    text-shadow: 0 0 5px rgba(138,138,138,.4);
  }

  /* --- footer: two tiers, because they get read differently.
         The LINK ROW is amber and bracketed like a DOS menu item -- against the
         grey provenance prose it is the one thing down here that reads as
         clickable. It used to be three dim-grey words inside that prose, and
         nobody ever found the story behind the program. --- */
  footer {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: .3rem;
    text-align: center;
    padding: .4rem 1rem .8rem;
  }
  #flinks { display: flex; flex-wrap: wrap; justify-content: center; gap: 0 1rem; }
  #flinks a {
    color: var(--accent);
    text-decoration: none;
    font-size: clamp(.8rem, 2.5vmin, 1.02rem);
    padding: .3em .15em;
    white-space: nowrap;
    text-shadow: 0 0 7px rgba(255,176,0,.5);
  }
  /* brackets in CSS, not in the label -- the label is swapped per language and
     shouldn't have to carry punctuation. NBSP so they never wrap off alone. */
  #flinks a::before { content: "[\00a0"; }
  #flinks a::after  { content: "\00a0]"; }
  #flinks a:hover, #flinks a:focus-visible {
    color: var(--bright);
    text-shadow: 0 0 10px rgba(255,225,77,.75);
  }
  #provenance { color: var(--dim); font-size: clamp(.65rem, 2vmin, .85rem); }

  /* Short windows, yielding in order (responsive-layout-standard: compact
     before drop). The link row is the LAST thing in the footer to go, not the
     first -- shedding the whole footer at 430px was what buried it on a phone
     in landscape. */
  @media (max-height: 430px) {
    #banner, #provenance { display: none; }
    footer { padding: .2rem 1rem .45rem; }
    #flinks a { padding: .15em .15em; }
  }
  @media (max-height: 280px) {
    header { padding: .3rem; gap: .3rem; }
    button { min-height: 36px; padding: .3em .6em; }
  }
  @media (max-height: 250px) {
    footer { display: none; }
  }
</style>
</head>
<body>

<header>
  <nav class="langs" aria-label="language">
    <button data-lang="sv">SV</button>
    <button data-lang="en">EN</button>
    <button data-lang="th" lang="th">ไทย</button>
    <button data-lang="ru">RU</button>
    <button data-lang="nl">NL</button>
    <button data-lang="el">ΕΛ</button>
    <button data-lang="pl">PL</button>
    <button data-lang="fr">FR</button>
  </nav>
  <button id="more">One more</button>
  <button id="auto" aria-pressed="false">[ ] Auto</button>
</header>

<!-- This version numbers THE SITE, not any one edition. Each edition carries
     its own version in its data file's header (Swedish is 1.0, Thai 0.5, Greek
     and French and Polish 0.5, Dutch 0.4, English and Russian 0.3) and those
     move independently. Bump SITE_VERSION in the script below whenever the site
     ships a change: a new edition, an engine change, or a data file growing.
     The text here is only a no-JS fallback; the script overwrites it, so
     SITE_VERSION is the single source of truth and these cannot drift. -->
<div id="banner">COOKIE · Liket of Goto10 · ~1996</div>

<main>
  <div id="proverb" aria-live="polite"><span id="cursor"></span></div>
  <div id="mirror"></div>
</main>

<footer>
  <nav id="flinks" aria-label="about">
    <a id="readmeLink" href="readme-en.html">What is this?</a>
    <a id="homeLink" href="https://leifclaesson.github.io/">Who is Leif?</a>
    <a href="https://github.com/leifclaesson/proverb-masher">source</a>
  </nav>
  <div id="provenance">PowerBASIC 1996 → Python · Rust · JS 2026 —
    <span id="tagline">real proverbs, chopped and glued back wrong</span></div>
</footer>

<noscript><p style="text-align:center;padding:2rem">This machine needs its BASIC interpreter (JavaScript) turned on.</p></noscript>

<script>
/* COOKIE.BAS engine, fifth port. The two clever bits survive intact:
   1. Population-weighted section choice -- one slot per proverb, so fat
      sections (the decoy-stuffed Group 1) dominate the output.
   2. The retry rule: both picks must come from different lines. That makes an
      intact proverb rare but NOT impossible, and the "(almost)" has now been
      measured: every decoy shares its tail character-for-character with the
      real proverb it shadows, so gluing the real head to the decoy's tail
      reassembles the real line. The 1996 Swedish data does it about one roll
      in 92. The 1996 label was the Swedish curse `fanheller:`; per remaster
      tradition every edition swears in its own language -- "like hell" /
      "เหี้ยเอ้ย" / "чёрта с два" / "γαμώτο" / "gówno prawda" / "putain". This
      port hosts all eight, so it keeps the original's name in their honour. */

/* The site's own version -- NOT any edition's; each data file carries its own
   in its header. This string does two jobs, and the second one is why it must
   be bumped on every deploy that changes a data file:

   1. it fills the banner, and
   2. it is the cache key on every data fetch below.

   GitHub Pages serves data/*.TXT with Cache-Control: max-age=600 from a CDN
   whose edges cache independently. With plain unversioned URLs a deploy is NOT
   atomic: for up to ten minutes some visitors get the NEW index.html and the
   OLD data file from whichever edge they land on. That is not theoretical --
   it shipped on 2026-08-03. Thai grew from 22 proverbs to 112, and Leif opened
   the site on a machine that had never loaded it before and still watched the
   old 22-line file cycle, repeating itself within a minute. Nothing was wrong
   with the data or the engine; an edge was simply still serving the old bytes.

   Appending ?v=<SITE_VERSION> makes every deploy a new URL, so no cache at any
   layer can pair new HTML with old data. */
const SITE_VERSION = "0.5";

const LANGS = {
  sv: { file: "data/ORDSPRÅK.TXT",   cp437: true,  period: true,  more: "En till",
        title: "ORDSPRÅK — mixade ordspråk",
        tagline: "riktiga ordspråk, ihopklippta på fel sätt",
        readme: "readme-sv.html",
        readmeLabel: "Vad är det här?",
        home: "Vem är Leif?",
        auto: "Auto",
        // The English mirror rides in a sidecar with the same groups and line
        // order, zipped in positionally at load. That was originally so the
        // 1996 file could stay byte-pristine; it grew on 2026-08-03 (Ordsprak
        // 1.0) and the sidecar shape stayed, because both files are now
        // generated together from one table by cookie-swedish-build.py.
        mirrorFile: "data/ORDSPRÅK-EN.TXT" },
  en: { file: "data/PROVERBS.TXT",   cp437: false, period: true,  more: "One more",
        title: "COOKIE — mashed-up proverbs",
        tagline: "real proverbs, chopped and glued back wrong",
        readme: "readme-en.html",
        readmeLabel: "What is this?",
        home: "Who is Leif?",
        auto: "Auto",
        // English is the only edition whose verbs conjugate for number, so
        // it is the only one whose tails carry alternations to resolve
        agree: true },
  th: { file: "data/สุภาษิต.txt",     cp437: false, period: false, more: "อีกอัน",
        title: "สุภาษิตมั่ว",
        tagline: "สุภาษิตจริง สับสลับผิดคู่",
        readme: "readme-th.html",
        readmeLabel: "นี่คืออะไร",
        home: "เลย์ฟ คือใคร",
        auto: "อัตโนมัติ" },
  ru: { file: "data/ПОСЛОВИЦЫ.TXT",  cp437: false, period: true,  more: "Ещё одну",
        title: "ПОСЛОВИЦЫ — перемолотые пословицы",
        tagline: "настоящие пословицы, склеенные не с теми половинками",
        readme: "readme-ru.html",
        readmeLabel: "Что это такое?",
        home: "Кто такой Лейф?",
        auto: "Авто" },
  nl: { file: "data/SPREEKWOORDEN.TXT", cp437: false, period: true, more: "Nog eentje",
        title: "SPREEKWOORDEN — door elkaar gehusselde spreekwoorden",
        tagline: "echte spreekwoorden, verkeerd aan elkaar geplakt",
        readme: "readme-nl.html",
        readmeLabel: "Wat is dit?",
        home: "Wie is Leif?",
        auto: "Auto",
        // Dutch conjugates for number too, so it runs the English edition's
        // marker rule -- and it is the first edition to have BOTH that and an
        // English mirror, so it is the first where the mirror needs it as well
        agree: true },
  el: { file: "data/ΠΑΡΟΙΜΙΕΣ.TXT", cp437: false, period: true, more: "Άλλη μία",
        title: "ΠΑΡΟΙΜΙΕΣ — ανακατεμένες παροιμίες",
        tagline: "αληθινές παροιμίες, κολλημένες σε λάθος μισά",
        readme: "readme-el.html",
        readmeLabel: "Τι είναι αυτό;",
        home: "Ποιος είναι ο Λέιφ;",
        auto: "Αυτόματο",
        // Greek conjugates for number as well, so it runs the same marker rule
        // as English and Dutch -- with one twist the resolver never sees: the
        // copula does NOT inflect (αυτός είναι / αυτοί είναι), so the verb that
        // is (is/are) and (is/zijn) elsewhere carries no marker here at all.
        // Needs no font exception either; Consolas has a full Greek face.
        agree: true },
  pl: { file: "data/PRZYSŁOWIA.TXT", cp437: false, period: true, more: "Jeszcze jedno",
        title: "PRZYSŁOWIA — pomieszane przysłowia",
        tagline: "prawdziwe przysłowia, sklejone nie tymi połówkami",
        readme: "readme-pl.html",
        readmeLabel: "Co to jest?",
        home: "Kim jest Leif?",
        auto: "Auto",
        // Polish conjugates for number as well, so the same marker rule again --
        // with the mirror image of the Greek twist: (jest/są) is not just marked
        // but SUPPLETIVE, sharing no letter at all, which is the strongest case
        // in seven editions for carrying both forms instead of deriving one.
        // Polish also has a gender that exists only in the plural (virile
        // "drodzy" vs non-virile "drogie") -- but the present tense collapses
        // them, so the resolver below never has to know it exists.
        agree: true },
  fr: { file: "data/PROVERBES.TXT", cp437: false, period: true, more: "Encore un",
        title: "PROVERBES — des proverbes mélangés",
        tagline: "de vrais proverbes, recollés dans le mauvais ordre",
        readme: "readme-fr.html",
        readmeLabel: "C'est quoi, ça ?",
        home: "Qui est Leif ?",
        auto: "Auto",
        // French conjugates for number as well, so the same marker rule again --
        // and it is the loudest argument yet for a file that carries both forms
        // rather than deriving one. The seam falls somewhere different for every
        // verb class -- tomb(e/ent), pourri(t/ssent), crai(nt/gnent),
        // va(ut/lent), sui(t/vent) -- and for `faire` there is no seam at all:
        // fait / font share not one letter. It is also the first edition whose
        // agreement is INAUDIBLE: the whole first conjugation, which is most of
        // the language, sounds identical in both numbers, and so do all four
        // written forms of the decoy adjective (cher/chère/chers/chères, /ʃɛʁ/).
        // Note the space before ? in the two UI strings above -- that is correct
        // French typography, not a stray character.
        agree: true },
};

/* CP437 high half (0x80..0xFF) -> Unicode, hand-spelled for the third time:
   BASIC never needed it, the Rust port carried it, now JS does. It doubles
   as a museum label for what DOS text actually was. */
const CP437_HIGH =
  "ÇüéâäàåçêëèïîìÄÅÉæÆôöòûùÿÖÜ¢£¥₧ƒáíóúñÑªº¿⌐¬½¼¡«»░▒▓│┤╡╢╖╕╣║╗╝╜╛┐" +
  "└┴┬├─┼╞╟╚╔╩╦╠═╬╧╨╤╥╙╘╒╓╫╪┘┌█▄▌▐▀αßΓπΣσµτΦΘΩδ∞φε∩≡±≥≤⌠⌡÷≈°∙·√ⁿ²■ ";
function decodeCp437(bytes) {
  let out = "";
  for (const b of bytes) out += b < 0x80 ? String.fromCharCode(b) : CP437_HIGH[b - 0x80];
  return out;
}

/* The COOKIE.BAS reader: #/;/' comment, * next section, ** hard EOF
   (the author's spares stay parked behind it, unreachable since 1996).
   Plus the one English-only addition: a leading + marks a PLURAL subject.
   It rides as a property so the numeric slots stay free for the SV mirror. */
function parse(text) {
  const sections = [[]];
  for (const raw of text.split(/\r?\n/)) {
    let line = raw.trimEnd();
    if (!line) continue;
    if ("#;'".includes(line[0])) continue;
    if (line === "*") { sections.push([]); continue; }
    if (line === "**") break;
    const plural = line[0] === "+";
    if (plural) line = line.slice(1);
    const parts = line.split("|");
    if (parts.length < 2) continue;
    parts.plural = plural;
    sections[sections.length - 1].push(parts);   // [head, tail, enHead?, enTail?]
  }
  return sections.filter(s => s.length);
}

/* Number agreement, English only -- and this is the whole of it. A tail
   carries BOTH forms: "(s)" is there in the singular and gone in the plural,
   "(x/y)" is x then y. So "Empty vessels" + "never change(s) (its/their)
   spots" is one substitution, with no verb table and no morphology anywhere.
   Deriving the forms instead would need a dictionary -- "rises" cuts to
   "rise" but "catches" cuts to "catch", same ending, different seam. */
function agree(tail, plural) {
  return tail.replace(/\(([^()/]*)(?:\/([^()]*))?\)/g,
                      (_, sg, pl) => plural ? (pl || "") : sg);
}

/* Russian punctuation rides in the tail: a leading comma/colon glues on
   with no space. Harmless for the other editions. */
function glue(head, tail) {
  if (tail && ",:;".includes(tail[0])) return head + tail;
  return head + " " + tail;
}

/* ?seed=N gives a reproducible stream (mulberry32); otherwise the modern
   RANDOMIZE TIMER is just Math.random. */
let rng = Math.random;
const seedParam = new URLSearchParams(location.search).get("seed");
if (seedParam) {
  let a = parseInt(seedParam, 10) >>> 0;
  rng = function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const randBelow = n => Math.floor(rng() * n);

function cook(sections, agreeOn) {
  // clever bit #1: population-weighted section choice
  const grupp = [];
  sections.forEach((s, i) => s.forEach(() => grupp.push(i)));
  const pool = sections[grupp[randBelow(grupp.length)]];

  // clever bit #2: fanheller -- the two lines must differ
  const r1 = randBelow(pool.length);
  let r2 = randBelow(pool.length);
  while (r2 === r1) r2 = randBelow(pool.length);

  // the head decides the number; the tail resolves its alternations against it
  const tail = agreeOn ? agree(pool[r2][1], pool[r1].plural) : pool[r2][1];

  // same index pair for the native line and the English mirror -- and the
  // mirror resolves its own alternations against the same head. Only Dutch
  // reaches this: it is the one edition that both conjugates for number and
  // carries a mirror, and the mirror is the half the author can actually read.
  const native = glue(pool[r1][0], tail);
  const mirrorTail = agreeOn ? agree(pool[r2][3] || "", pool[r1].plural)
                             : (pool[r2][3] || "");
  const mirror = pool[r1][2] !== undefined
    ? glue(pool[r1][2] || "", mirrorTail).trim() : "";
  return { native, mirror };
}

/* ---------------- UI ---------------- */

/* Data URL + the site version as a cache key. See SITE_VERSION above: without
   it a deploy is not atomic and a CDN edge can hand a visitor new HTML with an
   old data file. */
function bust(path) { return encodeURI(path) + "?v=" + SITE_VERSION; }

const cache = {};
async function loadLang(code) {
  if (cache[code]) return cache[code];
  const cfg = LANGS[code];
  const res = await fetch(bust(cfg.file));
  const text = cfg.cp437
    ? decodeCp437(new Uint8Array(await res.arrayBuffer()))
    : await res.text();
  const sections = parse(text);
  if (cfg.mirrorFile) {
    // zip the sidecar's EN halves onto the pristine main data, position
    // by position; on any shape mismatch just skip the mirror
    try {
      const mirror = parse(await (await fetch(bust(cfg.mirrorFile))).text());
      sections.forEach((sec, s) => sec.forEach((p, i) => {
        const m = mirror[s] && mirror[s][i];
        if (m) { p[2] = m[0]; p[3] = m[1]; }
      }));
    } catch (e) {}
  }
  return (cache[code] = sections);
}

let current = "en";

/* ---------------- Leif's own typing cadence ----------------
   Measured 2026-07-29 for headroom (see its composer.rs): five timed runs of
   `/remote-control`, every keystroke logged, any run with a backspace thrown
   out. The point of it is that the shape is his FINGERING, not one flat speed
   -- so this models the TRANSITION rather than replaying that one string:

     hand alternation, same row       48ms   (o->t 47, e->m 48, o->n 48)
     hand alternation, row change     88ms   (r->e 87, e->- 88, m->o 95)
     same hand, neighbouring finger   56ms   (n->t 56, a roll)
     same hand, row change           140ms   (t->r 136, -->c 144)

   Those four numbers ARE his five runs, bucketed by transition -- not a guess
   at what reads as human. A flat mean types the hard transitions too fast and
   the easy ones too slow, which is exactly what does NOT look like a person.

   He types Svorak, whose Latin block is plain Dvorak, so letters are placed
   from that. His home row is `aoeuidhtns-'` (from him, same day), which is why
   `-` is a right PINKY below and not a reach to the bottom-right -- getting
   that wrong is what sent the first cadence analysis down a blind alley.
   Swedish-QWERTY punctuation keeps its QWERTY spot and is deliberately NOT
   modelled: unknown keys take the fallback instead of an invented position. */

const GAP_FALLBACK = 87;   // pooled median of all 70 of his measured gaps
const GAP_SPACE    = 75;   // thumb, alternates with everything -- extrapolated
const GAP_SAMEFING = 170;  // slowest possible; never occurred in his sample
const GAP_SHIFT    = 40;   // right pinky reaching shift -- extrapolated
const ENTER_GAP    = 152;  // his measured pause before Enter, a different motion

const SVORAK = (() => {
  const rows = ["',.py|fgcrl", "aoeui|dhtns", ";qjkx|bmwvz"];
  const fingers = [[0, 1, 2, 3, 3], [3, 3, 2, 1, 0]];   // pinky=0 .. index=3
  const map = {};
  rows.forEach((r, row) => r.split("|").forEach((half, hand) => {
    for (let i = 0; i < half.length; i++) map[half[i]] = { hand, row, finger: fingers[hand][i] };
  }));
  map["-"] = { hand: 1, row: 1, finger: 0 };   // HIS home row, not QWERTY's
  return map;
})();

/* His 14 actual measured gaps, keyed by the bigram that produced them. A
   proverb containing "ot" gets his real 47ms, not a bucket's guess. Same
   structure his Rust uses (exact table + fallback), just keyed by the letter
   pair instead of by position, so it carries over to any text. */
const HIS_BIGRAMS = {
  "/r": 112, "re": 87, "em": 48, "mo": 95, "ot": 47, "te": 81, "e-": 88,
  "-c": 144, "co": 96, "on": 48, "nt": 56, "tr": 136, "ro": 64, "ol": 88,
};

function gapMs(from, to) {
  // the planned break is a real keystroke: his measured pause before Enter,
  // and the same again on the way back out to the first letter of the new line
  if (from === "\n" || to === "\n") return ENTER_GAP;
  const lo = from.toLowerCase(), hi = to.toLowerCase();
  const measured = HIS_BIGRAMS[lo + hi];
  if (measured !== undefined) return measured;
  if (from === " " || to === " ") return GAP_SPACE;
  const a = SVORAK[lo], b = SVORAK[hi];
  if (!a || !b) return GAP_FALLBACK;
  let ms;
  if (a.hand !== b.hand)          ms = a.row === b.row ? 48 : 88;
  else if (a.finger === b.finger) ms = GAP_SAMEFING;
  else                            ms = a.row === b.row ? 56 : 140;
  // A pinky destination is visibly slower in his runs even on an easy
  // alternation: e->- and o->l both 88, against o->t 47 and o->n 48.
  if (b.finger === 0) ms += 30;
  if (to !== to.toLowerCase()) ms += GAP_SHIFT;
  return ms;
}

/* His own jitter, kept exactly: uniform 60%-150% of the base, floor 8ms, which
   reproduces roughly the 16-184ms spread his runs actually showed. Drawn from
   the page rng so ?seed= still gives a reproducible stream. */
const jitter = ms => Math.max(8, Math.round(ms * (60 + rng() * 91) / 100));

/* A generation token retires every in-flight timer at once -- and there are two
   of them now, the native line and its mirror. Cheaper and safer than juggling
   ids: setTimeout and setInterval share ONE id pool, so a cleared auto-timer id
   can be handed straight back to the next typing timer. Only serve() bumps it;
   the typers merely READ it, so neither can retire the other. */
let gen = 0;

/* Whether a line is currently being printed. The autocycle's dwell is defined
   as the pause AFTER a line finishes, so nothing may arm it while one is still
   going -- see the auto button. */
let typing = false;

/* ---------------- the typing surfaces ----------------
   A terminal does not shove the text it has already printed around, and this
   one used to: the block was centred and freely wrapped, so every keystroke
   nudged the line left by half a character, a word that stopped fitting jumped
   down AFTER it was half typed, and the new line pushed everything above it up
   the screen. Three different kinds of movement, all from the same cause --
   letting the browser lay out text that isn't finished yet.

   So each block is laid out ONCE, from the finished string, before a single
   character is typed:

     - the breaks are worked out in advance, and typed as an Enter BEFORE the
       word that wouldn't fit rather than happening under it afterwards;
     - one .ln per line exists from the start, so the block already stands at
       its final height and the centred layout never shifts vertically;
     - each .ln is indented by half its own FINISHED width, so its characters
       land where they will finally sit and never slide.

   Measuring happens in a hidden probe inside the box itself, so it inherits the
   real font -- including the Thai swap -- at the real size. It measures twice:
   once with the text wrapping at the available width, which is how the break
   points are found (the browser's own line breaking, so Thai still breaks where
   ICU says it may), then once per line with wrapping off, for the exact width
   the indent needs. Both happen inside one synchronous block, so nothing is
   ever painted mid-measurement.

   The cursor is simply moved into whichever line is being typed. The nowrap
   knot that used to weld it to the last character is gone along with the
   wrapping it was defending against: nothing can re-wrap here any more, and the
   width the cursor needs is subtracted before the breaks are chosen, so it
   always has room at the end of its line. */

const cursorEl = document.getElementById("cursor");
const proverbEl = document.getElementById("proverb");
const mirrorEl = document.getElementById("mirror");
const segmenter = window.Intl && Intl.Segmenter
  ? new Intl.Segmenter(undefined, { granularity: "grapheme" }) : null;

/* Cluster boundaries, not code points: a Thai vowel or tone mark has to stay
   welded to the consonant it sits on -- measuring one half of a cluster on its
   own would report a rect for something that isn't a character. */
function clusters(s) {
  const out = [];
  if (segmenter) {
    for (const g of segmenter.segment(s)) out.push([g.index, g.index + g.segment.length]);
  } else {
    let o = 0;
    for (const cp of Array.from(s)) { out.push([o, o + cp.length]); o += cp.length; }
  }
  return out;
}

/* Where the browser broke the probe's text, read back off the glyphs: a cluster
   whose rect sits lower than the one before it is the first on a new line. */
function readLines(node, text) {
  const range = document.createRange();
  const cuts = [];
  let last = null;
  for (const [s, e] of clusters(text)) {
    if (!text.slice(s, e).trim()) continue;   // a space AT a break has no honest rect
    range.setStart(node, s);
    range.setEnd(node, e);
    const r = range.getClientRects()[0];
    if (!r) continue;
    const top = Math.round(r.top);
    if (last !== null && top > last + 1) cuts.push(s);
    last = top;
  }
  const out = [];
  let prev = 0;
  for (const c of cuts) {
    let w = c;
    while (w > prev && /\s/.test(text[w - 1])) w--;   // drop the space that WAS the break
    out.push(text.slice(prev, w));
    prev = c;
  }
  out.push(text.slice(prev));
  return out;
}

function makeSurface(box, withCursor) {
  const probe = document.createElement("span");
  probe.className = "probe";
  box.appendChild(probe);
  let divs = [];

  /* The cursor has to fit at the end of every line, so its advance comes off
     the width the breaks are chosen against -- otherwise the last character of
     a full line and its cursor would be exactly the pair that doesn't fit, and
     the jump would be back. */
  function reserve() {
    if (!withCursor) return 0;
    const cs = getComputedStyle(cursorEl);
    return cursorEl.offsetWidth + (parseFloat(cs.marginLeft) || 0);
  }

  function layout(text) {
    const full = box.clientWidth;
    probe.style.width = Math.max(1, full - reserve()) + "px";
    probe.style.whiteSpace = "normal";
    probe.textContent = text;
    const lines = probe.firstChild ? readLines(probe.firstChild, text) : [""];

    probe.style.width = "auto";
    probe.style.whiteSpace = "pre";
    const widths = lines.map(l => {
      probe.textContent = l;
      return probe.getBoundingClientRect().width;
    });
    probe.textContent = "";

    divs.forEach(d => d.remove());
    divs = lines.map((l, k) => {
      const d = document.createElement("div");
      d.className = "ln";
      d.style.paddingLeft = Math.max(0, Math.round((full - widths[k]) / 2)) + "px";
      box.appendChild(d);
      return d;
    });
    return lines.join("\n");
  }

  /* textContent on a div holding the cursor evicts it from the DOM, which is
     why every line is written first and the cursor re-homed after. */
  function paint(prefix) {
    const parts = prefix.split("\n");
    divs.forEach((d, k) => { d.textContent = parts[k] === undefined ? "" : parts[k]; });
    if (withCursor && divs.length) {
      divs[Math.min(parts.length - 1, divs.length - 1)].appendChild(cursorEl);
    }
  }

  return { layout, paint };
}

const nativeSurface = makeSurface(proverbEl, true);
const mirrorSurface = makeSurface(mirrorEl, false);

/* One typewriter, driving whichever surface it's handed. Its position lives on
   the state object rather than in the closure so a window resize can re-cut the
   plan underneath a line that is still being typed (see relayout). */
function typeInto(st, onStep, done) {
  const mine = gen;
  st.chars = Array.from(st.plan);
  st.i = 0;
  st.surface.paint("");
  (function step() {
    if (mine !== gen) return;               // a newer line took over
    const c = st.chars;
    st.surface.paint(c.slice(0, ++st.i).join(""));
    if (onStep) onStep(st.i);
    if (st.i >= c.length) { setTimeout(() => { if (mine === gen) done(); }, ENTER_GAP); return; }
    setTimeout(step, jitter(gapMs(c[st.i - 1], c[st.i])));
  })();
}

/* The plan's newlines are decided in advance but only VALID for the width they
   were measured at, so a resize (or a phone rotating) has to re-cut both lines.
   The position is carried across as a count of real characters -- newlines
   don't count, they aren't part of the text -- and any break that now falls
   exactly at the cut is stepped over, so the cursor lands on the new line
   rather than waiting at the end of the old one. */
let live = [];

function relayout() {
  for (const st of live) {
    const typed = st.chars.slice(0, st.i).filter(c => c !== "\n").length;
    st.plan = st.surface.layout(st.text);
    st.chars = Array.from(st.plan);
    let n = 0, j = 0;
    while (j < st.chars.length && n < typed) { if (st.chars[j] !== "\n") n++; j++; }
    while (j < st.chars.length && st.chars[j] === "\n") j++;
    st.i = j;
    st.surface.paint(st.chars.slice(0, j).join(""));
  }
}

/* Its own timer id, nulled on fire: setTimeout ids are recycled, and clearing a
   stale one could take a typing timer down with it. */
let resizeTimer = 0;
addEventListener("resize", () => {
  if (resizeTimer) clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { resizeTimer = 0; relayout(); }, 120);
});

/* The mirror types ALONGSIDE the line it translates instead of landing
   finished the moment that line ends -- two people at two keyboards, the
   translator a few characters behind like a live captioner. It obeys the same
   cadence RULES (same gapMs, same jitter, its own draw from the stream), not
   the same timings: the two lines are different lengths in different scripts,
   so welding them character-to-character would mean stretching one of them
   into a rhythm no hand types. They drift, and the drift is the point. */
const MIRROR_LEAD = 5;                      // characters of head start

async function serve() {
  cancelAuto();                     // before the await: a pending dwell must not fire into this line
  const cfg = LANGS[current];
  const sections = await loadLang(current);
  const { native, mirror } = cook(sections, cfg.agree);
  const line = cfg.period ? native + "." : native;
  const mirrorLine = mirror ? "(" + mirror + ")" : "";

  proverbEl.classList.toggle("thai", current === "th");   // before measuring: the font decides the breaks

  gen++;                            // retire any typing in flight; everything below rides THIS generation

  /* Both surfaces are laid out before either starts typing -- that is what
     holds the mirror still while the line above it fills in, instead of having
     it shoved down the moment that line takes a second row. */
  const nat = { surface: nativeSurface, text: line, plan: "", chars: [], i: 0 };
  const mir = { surface: mirrorSurface, text: mirrorLine, plan: "", chars: [], i: 0 };
  nat.plan = nativeSurface.layout(line);
  mir.plan = mirrorSurface.layout(mirrorLine);
  nat.chars = Array.from(nat.plan);
  mir.chars = Array.from(mir.plan);
  live = [nat, mir];

  if (!typeOn) {
    nat.i = nat.chars.length;
    mir.i = mir.chars.length;
    nativeSurface.paint(nat.plan);
    mirrorSurface.paint(mir.plan);
    typing = false;
    scheduleAuto();
  } else {
    nativeSurface.paint("");
    mirrorSurface.paint("");
    typing = true;
    // the autocycle dwell starts when the LAST line finishes, not when the
    // native one does, so neither a long line nor a long mirror is ever cut
    // short on a monitor
    let pending = mirrorLine ? 2 : 1;
    const finished = () => { if (--pending === 0) { typing = false; scheduleAuto(); } };
    let started = false;
    const startMirror = () => {
      if (started || !mirrorLine) return;
      started = true;
      typeInto(mir, null, finished);
    };
    typeInto(nat, i => { if (i >= MIRROR_LEAD) startMirror(); },
             () => { startMirror(); finished(); });   // a line shorter than the lead still gets its mirror
  }
}

/* --- autocycle, so it can be left up on a monitor (Alex Hartman's idea).
   [ ] and [X] are the same width in a monospace face, so the button never
   jitters as it toggles -- the one place the fake-retro font earns its keep.
   ?auto=1 arms it; ?auto=20 arms it AND sets the DWELL in seconds -- the pause
   after a line finishes typing, not a fixed period, so a long line is never cut
   short. For a display with no keyboard in front of it. */
const AUTO_DEFAULT = 10;          // README quotes this number -- change both
let autoOn = false, autoSecs = AUTO_DEFAULT, autoTimer = 0;
/* The type-on runs ALWAYS. It deliberately does not consult
   prefers-reduced-motion: that flag is how you turn off window transitions and
   other OS fidgeting, and it has no business deciding whether a terminal prints
   its line. ?type=0 is the explicit off switch for anyone who wants one. */
let typeOn = true;
const autoBtn = document.getElementById("auto");

function paintAuto() {
  autoBtn.textContent = (autoOn ? "[X] " : "[ ] ") + LANGS[current].auto;
  autoBtn.setAttribute("aria-pressed", autoOn ? "true" : "false");
}

/* Self-rescheduling from the end of serve() rather than a standing interval, so
   the dwell is a pause AFTER a line finishes and a long line is never cut
   short. That only holds if the armed timer is disowned the moment anything
   else serves a line -- a language switch, "One more", the spacebar -- because
   otherwise the timer from the PREVIOUS line is still out there and fires
   partway through the new one. Hence cancelAuto() at the top of serve() rather
   than relying on the clear at the bottom, which doesn't come round until the
   new line (and its mirror) have finished typing.

   The id is zeroed whenever it's spent or dropped: setTimeout ids are recycled,
   and clearing a stale one could take a typing timer down with it. */
function cancelAuto() {
  if (autoTimer) { clearTimeout(autoTimer); autoTimer = 0; }
}

function scheduleAuto() {
  cancelAuto();
  if (autoOn) autoTimer = setTimeout(() => { autoTimer = 0; serve(); }, autoSecs * 1000);
}

autoBtn.addEventListener("click", () => {
  autoOn = !autoOn;
  paintAuto();
  try { localStorage.setItem("cookieAuto", autoOn ? "1" : "0"); } catch (e) {}
  // Arming it midway through a line must NOT start the dwell from here -- with
  // a short dwell that timer would fire before the line was finished and cut it
  // off. Drop any pending one; the line that's printing will arm the next.
  if (typing) cancelAuto(); else scheduleAuto();
});

function setLang(code, save = true) {
  current = code;
  const cfg = LANGS[code];
  document.documentElement.lang = code;
  document.title = cfg.title;
  const more = document.getElementById("more");
  const tagline = document.getElementById("tagline");
  more.textContent = cfg.more;
  tagline.textContent = cfg.tagline;
  const home = document.getElementById("homeLink");
  const readme = document.getElementById("readmeLink");
  home.textContent = cfg.home;
  // "README" is jargon -- a visitor doesn't know it's the story of a 1996 DOS
  // program. Ask the question they'd actually ask, in their own language.
  readme.textContent = cfg.readmeLabel;
  readme.href = cfg.readme;
  // stamp lang so the Thai strings pick up the real Thai font (see CSS)
  more.lang = tagline.lang = home.lang = readme.lang = autoBtn.lang = code;
  paintAuto();
  document.querySelectorAll(".langs button").forEach(b =>
    b.classList.toggle("active", b.dataset.lang === code));
  if (save) try { localStorage.setItem("cookieLang", code); } catch (e) {}
  serve();
}

document.querySelectorAll(".langs button").forEach(b =>
  b.addEventListener("click", () => setLang(b.dataset.lang)));
document.getElementById("more").addEventListener("click", serve);
addEventListener("keydown", e => {
  if (e.code === "Space" && !e.repeat) { e.preventDefault(); serve(); }
});

/* pick a start language: ?lang= beats the saved choice beats the browser.
   Same precedence for the autocycle, and it must settle BEFORE setLang --
   setLang serves a line, and serving a line arms the next one. */
(function () {
  const params = new URLSearchParams(location.search);
  const a = params.get("auto");
  if (a !== null) {
    autoOn = a !== "0";
    const secs = parseFloat(a);
    if (secs > 1) autoSecs = secs;      // ?auto=20 -> dwell 20s on each line
  } else {
    try { autoOn = localStorage.getItem("cookieAuto") === "1"; } catch (e) {}
  }

  const t = params.get("type");
  if (t !== null) {
    typeOn = t !== "0";
    try { localStorage.setItem("cookieType", typeOn ? "1" : "0"); } catch (e) {}
  } else {
    try {
      const saved = localStorage.getItem("cookieType");
      if (saved !== null) typeOn = saved === "1";
    } catch (e) {}
  }

  const q = params.get("lang");
  let saved = null;
  try { saved = localStorage.getItem("cookieLang"); } catch (e) {}
  const nav = (navigator.languages || [navigator.language || "en"])
    .map(l => l.slice(0, 2).toLowerCase()).find(l => LANGS[l]);
  // one source of truth for the version: the HTML carries a no-JS fallback
  // without a number, and SITE_VERSION fills it in here
  const bn = document.getElementById("banner");
  if (bn) bn.textContent = "COOKIE v" + SITE_VERSION + " · Liket of Goto10 · ~1996";
  setLang(LANGS[q] ? q : LANGS[saved] ? saved : nav || "en", false);
})();

console.log("fanheller: -- Liket of Goto10, ~1996");
</script>

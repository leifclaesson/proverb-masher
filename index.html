<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>COOKIE — mashed-up proverbs</title>
<meta name="description" content="A proverb masher from 1996: real proverbs chopped in half and glued back wrong, in Swedish, English, Thai, Russian, Dutch and Greek. Grammar right, meaning mangled.">
<style>
  /* ============================================================
     COOKIE.BAS (Liket of Goto10, ~1996) -- the web port.
     DOS/CRT look; the proverb line is the PROTECTED element:
     it wraps and shrinks via clamp() but never clips or drops.
     Yield order on small windows: banner, footer, then nothing.
     ============================================================ */
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #050505;
    --fg: #d8d8d8;
    --dim: #8a8a8a;
    --bright: #ffe14d;          /* BASIC COLOR 14 */
    --accent: #ffb000;          /* amber phosphor */
    --mono: Consolas, "Cascadia Mono", "Courier New", monospace;
    /* Thai must render in a proper Thai font -- never the fake-retro mono */
    --thai: "Leelawadee UI", "Noto Sans Thai", Thonburi, sans-serif;
  }

  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--mono);
    display: flex;
    flex-direction: column;
    min-height: 100dvh;
    overflow-x: hidden;
  }

  /* CRT dressing: vignette + scanlines, purely decorative overlays */
  body::before {
    content: "";
    position: fixed; inset: 0;
    background: radial-gradient(ellipse at center,
                transparent 55%, rgba(0,0,0,.55) 100%);
    pointer-events: none;
    z-index: 3;
  }
  body::after {
    content: "";
    position: fixed; inset: 0;
    background: repeating-linear-gradient(
      to bottom, transparent 0 2px, rgba(0,0,0,.22) 2px 3px);
    pointer-events: none;
    z-index: 4;
    animation: flicker 4s infinite;
  }
  @keyframes flicker {
    0%, 100% { opacity: 1; }
    92%      { opacity: 1; }
    93%      { opacity: .82; }
    94%      { opacity: 1; }
  }
  /* Only the full-screen scanline flicker yields to reduce-motion. The cursor
     blink does NOT: people set that flag to kill window transitions, not to ask
     a DOS terminal to stop being one, and a hardware cursor that doesn't blink
     is just broken. Same reasoning as the type-on (see typeOn below). */
  @media (prefers-reduced-motion: reduce) {
    body::after { animation: none; }
  }

  /* --- top bar: controls pinned to the TOP so they never shift
         under the cursor when lines differ in length (the 1996
         tkinter edition's rule, kept) --- */
  header {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: .6rem .9rem;
    padding: clamp(.5rem, 2vmin, 1.1rem);
    z-index: 5;
  }
  .langs { display: flex; gap: .45rem; flex-wrap: wrap; justify-content: center; }
  button {
    font-family: var(--mono);
    font-size: clamp(.85rem, 2.6vmin, 1.05rem);
    background: transparent;
    color: var(--fg);
    border: 1px solid var(--dim);
    padding: .5em .8em;
    min-height: 44px;
    cursor: pointer;
    text-shadow: 0 0 6px rgba(216,216,216,.35);
  }
  /* Any chrome holding Thai script gets the real Thai font, never the
     fake-retro mono: the language button always, and the "one more" button +
     tagline whenever Thai is the active language (setLang stamps lang= on
     them). Scoped per element, because <html lang> gets rewritten to "th" on
     a language switch and must NOT re-font the whole latin UI. */
  button[lang="th"], #tagline[lang="th"],
  #homeLink[lang="th"], #readmeLink[lang="th"] { font-family: var(--thai); }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button.active, #more:active {
    background: var(--accent);
    color: #000;
    border-color: var(--accent);
    text-shadow: none;
  }
  #more {
    color: var(--bright);
    border-color: var(--bright);
    font-weight: bold;
  }
  #more:hover { background: var(--bright); color: #000; text-shadow: none; }
  /* the autocycle checkbox: armed state is a colour shift, NOT the filled
     .active look -- that one belongs to the selected language and shouldn't
     read as "this is the current thing" on a toggle sitting next to it */
  #auto[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); }

  /* --- banner: first to shed on short windows --- */
  #banner {
    text-align: center;
    color: var(--dim);
    font-size: clamp(.7rem, 2.2vmin, .95rem);
    padding: 0 1rem;
    text-shadow: 0 0 5px rgba(138,138,138,.4);
  }

  /* --- the proverb: the protected element --- */
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(.6rem, 2.5vmin, 1.4rem);
    padding: clamp(.8rem, 3vmin, 2rem);
    overflow-y: auto;
    min-height: 0;
  }
  #proverb {
    max-width: 21ch;
    min-width: min(100%, 21ch);
    text-align: center;
    font-size: clamp(1.25rem, 5.5vmin, 2.6rem);
    line-height: 1.45;
    color: var(--bright);
    text-shadow: 0 0 10px rgba(255,225,77,.5), 0 0 2px rgba(255,225,77,.9);
    overflow-wrap: break-word;
  }
  #proverb.thai {
    font-family: var(--thai);
    line-height: 1.7;
  }
  /* The cursor is WELDED to the last character: they share one nowrap span, so
     the browser has no break opportunity between them and can never strand the
     cursor alone on the line below. The cursor is an inline-block, which is
     atomic -- without this, break-word would break in front of it and send it
     down by itself, since it's the one thing on the line that cannot be split.
     When the pair no longer fits, the character comes down WITH the cursor. */
  #knot { white-space: nowrap; }
  /* the DOS hardware cursor: a thick blinking underscore at the bottom
     of the character cell, not a solid block */
  #cursor {
    display: inline-block;
    width: 1ch;
    height: .13em;
    margin-left: .15ch;
    background: var(--bright);
    box-shadow: 0 0 8px rgba(255,225,77,.7);
    vertical-align: -0.24em;   /* the bottom scanlines of the cell, below the baseline */
    animation: blink 1.06s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  #mirror {
    max-width: 60ch;
    text-align: center;
    color: var(--dim);
    font-style: italic;
    font-size: clamp(.85rem, 3vmin, 1.15rem);
    line-height: 1.5;
    min-height: 1.5em;      /* reserve one line so the layout never jumps */
    text-shadow: 0 0 5px rgba(138,138,138,.4);
  }

  /* --- footer: two tiers, because they get read differently.
         The LINK ROW is amber and bracketed like a DOS menu item -- against the
         grey provenance prose it is the one thing down here that reads as
         clickable. It used to be three dim-grey words inside that prose, and
         nobody ever found the story behind the program. --- */
  footer {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: .3rem;
    text-align: center;
    padding: .4rem 1rem .8rem;
  }
  #flinks { display: flex; flex-wrap: wrap; justify-content: center; gap: 0 1rem; }
  #flinks a {
    color: var(--accent);
    text-decoration: none;
    font-size: clamp(.8rem, 2.5vmin, 1.02rem);
    padding: .3em .15em;
    white-space: nowrap;
    text-shadow: 0 0 7px rgba(255,176,0,.5);
  }
  /* brackets in CSS, not in the label -- the label is swapped per language and
     shouldn't have to carry punctuation. NBSP so they never wrap off alone. */
  #flinks a::before { content: "[\00a0"; }
  #flinks a::after  { content: "\00a0]"; }
  #flinks a:hover, #flinks a:focus-visible {
    color: var(--bright);
    text-shadow: 0 0 10px rgba(255,225,77,.75);
  }
  #provenance { color: var(--dim); font-size: clamp(.65rem, 2vmin, .85rem); }

  /* Short windows, yielding in order (responsive-layout-standard: compact
     before drop). The link row is the LAST thing in the footer to go, not the
     first -- shedding the whole footer at 430px was what buried it on a phone
     in landscape. */
  @media (max-height: 430px) {
    #banner, #provenance { display: none; }
    footer { padding: .2rem 1rem .45rem; }
    #flinks a { padding: .15em .15em; }
  }
  @media (max-height: 280px) {
    header { padding: .3rem; gap: .3rem; }
    button { min-height: 36px; padding: .3em .6em; }
  }
  @media (max-height: 250px) {
    footer { display: none; }
  }
</style>
</head>
<body>

<header>
  <nav class="langs" aria-label="language">
    <button data-lang="sv">SV</button>
    <button data-lang="en">EN</button>
    <button data-lang="th" lang="th">ไทย</button>
    <button data-lang="ru">RU</button>
    <button data-lang="nl">NL</button>
    <button data-lang="el">ΕΛ</button>
  </nav>
  <button id="more">One more</button>
  <button id="auto" aria-pressed="false">[ ] Auto</button>
</header>

<div id="banner">COOKIE v0.3 · Liket of Goto10 · ~1996</div>

<main>
  <div id="proverb" aria-live="polite"><span id="text"></span><span id="knot"><span id="tail"></span><span id="cursor"></span></span></div>
  <div id="mirror"></div>
</main>

<footer>
  <nav id="flinks" aria-label="about">
    <a id="readmeLink" href="readme-en.html">What is this?</a>
    <a id="homeLink" href="https://leifclaesson.github.io/">Who is Leif?</a>
    <a href="https://github.com/leifclaesson/proverb-masher">source</a>
  </nav>
  <div id="provenance">PowerBASIC 1996 → Python · Rust · JS 2026 —
    <span id="tagline">real proverbs, chopped and glued back wrong</span></div>
</footer>

<noscript><p style="text-align:center;padding:2rem">This machine needs its BASIC interpreter (JavaScript) turned on.</p></noscript>

<script>
/* COOKIE.BAS engine, fifth port. The two clever bits survive intact:
   1. Population-weighted section choice -- one slot per proverb, so fat
      sections (the decoy-stuffed Group 1) dominate the output.
   2. The retry rule: both picks must come from different lines. That makes an
      intact proverb rare but NOT impossible, and the "(almost)" has now been
      measured: every decoy shares its tail character-for-character with the
      real proverb it shadows, so gluing the real head to the decoy's tail
      reassembles the real line. The 1996 Swedish data does it about one roll
      in 92. The 1996 label was the Swedish curse `fanheller:`; per remaster
      tradition every edition swears in its own language -- "like hell" /
      "เหี้ยเอ้ย" / "чёрта с два" / "γαμώτο". This port hosts all six, so it
      keeps the original's name in their honour. */

const LANGS = {
  sv: { file: "data/ORDSPRÅK.TXT",   cp437: true,  period: true,  more: "En till",
        title: "ORDSPRÅK — mixade ordspråk",
        tagline: "riktiga ordspråk, ihopklippta på fel sätt",
        readme: "readme-sv.html",
        readmeLabel: "Vad är det här?",
        home: "Vem är Leif?",
        auto: "Auto",
        // the 1996 data file stays byte-pristine; its English mirror
        // rides in a sidecar with the same groups and line order
        mirrorFile: "data/ORDSPRÅK-EN.TXT" },
  en: { file: "data/PROVERBS.TXT",   cp437: false, period: true,  more: "One more",
        title: "COOKIE — mashed-up proverbs",
        tagline: "real proverbs, chopped and glued back wrong",
        readme: "readme-en.html",
        readmeLabel: "What is this?",
        home: "Who is Leif?",
        auto: "Auto",
        // English is the only edition whose verbs conjugate for number, so
        // it is the only one whose tails carry alternations to resolve
        agree: true },
  th: { file: "data/สุภาษิต.txt",     cp437: false, period: false, more: "อีกอัน",
        title: "สุภาษิตมั่ว",
        tagline: "สุภาษิตจริง สับสลับผิดคู่",
        readme: "readme-th.html",
        readmeLabel: "นี่คืออะไร",
        home: "เลย์ฟ คือใคร",
        auto: "อัตโนมัติ" },
  ru: { file: "data/ПОСЛОВИЦЫ.TXT",  cp437: false, period: true,  more: "Ещё одну",
        title: "ПОСЛОВИЦЫ — перемолотые пословицы",
        tagline: "настоящие пословицы, склеенные не с теми половинками",
        readme: "readme-ru.html",
        readmeLabel: "Что это такое?",
        home: "Кто такой Лейф?",
        auto: "Авто" },
  nl: { file: "data/SPREEKWOORDEN.TXT", cp437: false, period: true, more: "Nog eentje",
        title: "SPREEKWOORDEN — door elkaar gehusselde spreekwoorden",
        tagline: "echte spreekwoorden, verkeerd aan elkaar geplakt",
        readme: "readme-nl.html",
        readmeLabel: "Wat is dit?",
        home: "Wie is Leif?",
        auto: "Auto",
        // Dutch conjugates for number too, so it runs the English edition's
        // marker rule -- and it is the first edition to have BOTH that and an
        // English mirror, so it is the first where the mirror needs it as well
        agree: true },
  el: { file: "data/ΠΑΡΟΙΜΙΕΣ.TXT", cp437: false, period: true, more: "Άλλη μία",
        title: "ΠΑΡΟΙΜΙΕΣ — ανακατεμένες παροιμίες",
        tagline: "αληθινές παροιμίες, κολλημένες σε λάθος μισά",
        readme: "readme-el.html",
        readmeLabel: "Τι είναι αυτό;",
        home: "Ποιος είναι ο Λέιφ;",
        auto: "Αυτόματο",
        // Greek conjugates for number as well, so it runs the same marker rule
        // as English and Dutch -- with one twist the resolver never sees: the
        // copula does NOT inflect (αυτός είναι / αυτοί είναι), so the verb that
        // is (is/are) and (is/zijn) elsewhere carries no marker here at all.
        // Needs no font exception either; Consolas has a full Greek face.
        agree: true },
};

/* CP437 high half (0x80..0xFF) -> Unicode, hand-spelled for the third time:
   BASIC never needed it, the Rust port carried it, now JS does. It doubles
   as a museum label for what DOS text actually was. */
const CP437_HIGH =
  "ÇüéâäàåçêëèïîìÄÅÉæÆôöòûùÿÖÜ¢£¥₧ƒáíóúñÑªº¿⌐¬½¼¡«»░▒▓│┤╡╢╖╕╣║╗╝╜╛┐" +
  "└┴┬├─┼╞╟╚╔╩╦╠═╬╧╨╤╥╙╘╒╓╫╪┘┌█▄▌▐▀αßΓπΣσµτΦΘΩδ∞φε∩≡±≥≤⌠⌡÷≈°∙·√ⁿ²■ ";
function decodeCp437(bytes) {
  let out = "";
  for (const b of bytes) out += b < 0x80 ? String.fromCharCode(b) : CP437_HIGH[b - 0x80];
  return out;
}

/* The COOKIE.BAS reader: #/;/' comment, * next section, ** hard EOF
   (the author's spares stay parked behind it, unreachable since 1996).
   Plus the one English-only addition: a leading + marks a PLURAL subject.
   It rides as a property so the numeric slots stay free for the SV mirror. */
function parse(text) {
  const sections = [[]];
  for (const raw of text.split(/\r?\n/)) {
    let line = raw.trimEnd();
    if (!line) continue;
    if ("#;'".includes(line[0])) continue;
    if (line === "*") { sections.push([]); continue; }
    if (line === "**") break;
    const plural = line[0] === "+";
    if (plural) line = line.slice(1);
    const parts = line.split("|");
    if (parts.length < 2) continue;
    parts.plural = plural;
    sections[sections.length - 1].push(parts);   // [head, tail, enHead?, enTail?]
  }
  return sections.filter(s => s.length);
}

/* Number agreement, English only -- and this is the whole of it. A tail
   carries BOTH forms: "(s)" is there in the singular and gone in the plural,
   "(x/y)" is x then y. So "Empty vessels" + "never change(s) (its/their)
   spots" is one substitution, with no verb table and no morphology anywhere.
   Deriving the forms instead would need a dictionary -- "rises" cuts to
   "rise" but "catches" cuts to "catch", same ending, different seam. */
function agree(tail, plural) {
  return tail.replace(/\(([^()/]*)(?:\/([^()]*))?\)/g,
                      (_, sg, pl) => plural ? (pl || "") : sg);
}

/* Russian punctuation rides in the tail: a leading comma/colon glues on
   with no space. Harmless for the other editions. */
function glue(head, tail) {
  if (tail && ",:;".includes(tail[0])) return head + tail;
  return head + " " + tail;
}

/* ?seed=N gives a reproducible stream (mulberry32); otherwise the modern
   RANDOMIZE TIMER is just Math.random. */
let rng = Math.random;
const seedParam = new URLSearchParams(location.search).get("seed");
if (seedParam) {
  let a = parseInt(seedParam, 10) >>> 0;
  rng = function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const randBelow = n => Math.floor(rng() * n);

function cook(sections, agreeOn) {
  // clever bit #1: population-weighted section choice
  const grupp = [];
  sections.forEach((s, i) => s.forEach(() => grupp.push(i)));
  const pool = sections[grupp[randBelow(grupp.length)]];

  // clever bit #2: fanheller -- the two lines must differ
  const r1 = randBelow(pool.length);
  let r2 = randBelow(pool.length);
  while (r2 === r1) r2 = randBelow(pool.length);

  // the head decides the number; the tail resolves its alternations against it
  const tail = agreeOn ? agree(pool[r2][1], pool[r1].plural) : pool[r2][1];

  // same index pair for the native line and the English mirror -- and the
  // mirror resolves its own alternations against the same head. Only Dutch
  // reaches this: it is the one edition that both conjugates for number and
  // carries a mirror, and the mirror is the half the author can actually read.
  const native = glue(pool[r1][0], tail);
  const mirrorTail = agreeOn ? agree(pool[r2][3] || "", pool[r1].plural)
                             : (pool[r2][3] || "");
  const mirror = pool[r1][2] !== undefined
    ? glue(pool[r1][2] || "", mirrorTail).trim() : "";
  return { native, mirror };
}

/* ---------------- UI ---------------- */
const cache = {};
async function loadLang(code) {
  if (cache[code]) return cache[code];
  const cfg = LANGS[code];
  const res = await fetch(encodeURI(cfg.file));
  const text = cfg.cp437
    ? decodeCp437(new Uint8Array(await res.arrayBuffer()))
    : await res.text();
  const sections = parse(text);
  if (cfg.mirrorFile) {
    // zip the sidecar's EN halves onto the pristine main data, position
    // by position; on any shape mismatch just skip the mirror
    try {
      const mirror = parse(await (await fetch(encodeURI(cfg.mirrorFile))).text());
      sections.forEach((sec, s) => sec.forEach((p, i) => {
        const m = mirror[s] && mirror[s][i];
        if (m) { p[2] = m[0]; p[3] = m[1]; }
      }));
    } catch (e) {}
  }
  return (cache[code] = sections);
}

let current = "en";

/* ---------------- Leif's own typing cadence ----------------
   Measured 2026-07-29 for headroom (see its composer.rs): five timed runs of
   `/remote-control`, every keystroke logged, any run with a backspace thrown
   out. The point of it is that the shape is his FINGERING, not one flat speed
   -- so this models the TRANSITION rather than replaying that one string:

     hand alternation, same row       48ms   (o->t 47, e->m 48, o->n 48)
     hand alternation, row change     88ms   (r->e 87, e->- 88, m->o 95)
     same hand, neighbouring finger   56ms   (n->t 56, a roll)
     same hand, row change           140ms   (t->r 136, -->c 144)

   Those four numbers ARE his five runs, bucketed by transition -- not a guess
   at what reads as human. A flat mean types the hard transitions too fast and
   the easy ones too slow, which is exactly what does NOT look like a person.

   He types Svorak, whose Latin block is plain Dvorak, so letters are placed
   from that. His home row is `aoeuidhtns-'` (from him, same day), which is why
   `-` is a right PINKY below and not a reach to the bottom-right -- getting
   that wrong is what sent the first cadence analysis down a blind alley.
   Swedish-QWERTY punctuation keeps its QWERTY spot and is deliberately NOT
   modelled: unknown keys take the fallback instead of an invented position. */

const GAP_FALLBACK = 87;   // pooled median of all 70 of his measured gaps
const GAP_SPACE    = 75;   // thumb, alternates with everything -- extrapolated
const GAP_SAMEFING = 170;  // slowest possible; never occurred in his sample
const GAP_SHIFT    = 40;   // right pinky reaching shift -- extrapolated
const ENTER_GAP    = 152;  // his measured pause before Enter, a different motion

const SVORAK = (() => {
  const rows = ["',.py|fgcrl", "aoeui|dhtns", ";qjkx|bmwvz"];
  const fingers = [[0, 1, 2, 3, 3], [3, 3, 2, 1, 0]];   // pinky=0 .. index=3
  const map = {};
  rows.forEach((r, row) => r.split("|").forEach((half, hand) => {
    for (let i = 0; i < half.length; i++) map[half[i]] = { hand, row, finger: fingers[hand][i] };
  }));
  map["-"] = { hand: 1, row: 1, finger: 0 };   // HIS home row, not QWERTY's
  return map;
})();

/* His 14 actual measured gaps, keyed by the bigram that produced them. A
   proverb containing "ot" gets his real 47ms, not a bucket's guess. Same
   structure his Rust uses (exact table + fallback), just keyed by the letter
   pair instead of by position, so it carries over to any text. */
const HIS_BIGRAMS = {
  "/r": 112, "re": 87, "em": 48, "mo": 95, "ot": 47, "te": 81, "e-": 88,
  "-c": 144, "co": 96, "on": 48, "nt": 56, "tr": 136, "ro": 64, "ol": 88,
};

function gapMs(from, to) {
  const lo = from.toLowerCase(), hi = to.toLowerCase();
  const measured = HIS_BIGRAMS[lo + hi];
  if (measured !== undefined) return measured;
  if (from === " " || to === " ") return GAP_SPACE;
  const a = SVORAK[lo], b = SVORAK[hi];
  if (!a || !b) return GAP_FALLBACK;
  let ms;
  if (a.hand !== b.hand)          ms = a.row === b.row ? 48 : 88;
  else if (a.finger === b.finger) ms = GAP_SAMEFING;
  else                            ms = a.row === b.row ? 56 : 140;
  // A pinky destination is visibly slower in his runs even on an easy
  // alternation: e->- and o->l both 88, against o->t 47 and o->n 48.
  if (b.finger === 0) ms += 30;
  if (to !== to.toLowerCase()) ms += GAP_SHIFT;
  return ms;
}

/* His own jitter, kept exactly: uniform 60%-150% of the base, floor 8ms, which
   reproduces roughly the 16-184ms spread his runs actually showed. Drawn from
   the page rng so ?seed= still gives a reproducible stream. */
const jitter = ms => Math.max(8, Math.round(ms * (60 + rng() * 91) / 100));

/* A generation token retires every in-flight timer at once. Cheaper and safer
   than juggling ids: setTimeout and setInterval share ONE id pool, so a cleared
   auto-timer id can be handed straight back to the next typing timer. */
let gen = 0;

/* The line is written into TWO elements: everything but the final character in
   #text, that last character in #tail, which rides in the nowrap #knot with the
   cursor (see the CSS). Split by GRAPHEME, not by code point -- a Thai vowel or
   tone mark has to stay welded to the consonant it sits on, and Array.from
   would tear the cluster in half across an element boundary. */
const textEl = document.getElementById("text");
const tailEl = document.getElementById("tail");
const segmenter = window.Intl && Intl.Segmenter
  ? new Intl.Segmenter(undefined, { granularity: "grapheme" }) : null;

function lastGraphemeStart(s) {
  if (!s) return 0;
  if (segmenter) {
    let start = 0;
    for (const g of segmenter.segment(s)) start = g.index;
    return start;
  }
  const cp = Array.from(s);                 // code-point fallback
  return s.length - cp[cp.length - 1].length;
}

function setLine(s) {
  const cut = lastGraphemeStart(s);
  textEl.textContent = s.slice(0, cut);
  tailEl.textContent = s.slice(cut);
}

function typeOut(line, done) {
  const chars = Array.from(line);
  const mine = ++gen;
  let i = 0;
  setLine("");
  (function step() {
    if (mine !== gen) return;               // a newer line took over
    setLine(chars.slice(0, ++i).join(""));
    if (i >= chars.length) { setTimeout(() => { if (mine === gen) done(); }, ENTER_GAP); return; }
    setTimeout(step, jitter(gapMs(chars[i - 1], chars[i])));
  })();
}

async function serve() {
  const cfg = LANGS[current];
  const sections = await loadLang(current);
  const { native, mirror } = cook(sections, cfg.agree);
  const line = cfg.period ? native + "." : native;

  const mirrorEl = document.getElementById("mirror");
  document.getElementById("proverb").classList.toggle("thai", current === "th");

  if (!typeOn) {
    gen++;                          // retire any typing still in flight
    setLine(line);
    mirrorEl.textContent = mirror ? "(" + mirror + ")" : "";
    scheduleAuto();
  } else {
    mirrorEl.textContent = "";
    // the autocycle dwell starts when the line FINISHES, not when it starts, so
    // a long line is never cut short on a monitor
    typeOut(line, () => {
      mirrorEl.textContent = mirror ? "(" + mirror + ")" : "";
      scheduleAuto();
    });
  }
}

/* --- autocycle, so it can be left up on a monitor (Alex Hartman's idea).
   [ ] and [X] are the same width in a monospace face, so the button never
   jitters as it toggles -- the one place the fake-retro font earns its keep.
   ?auto=1 arms it; ?auto=20 arms it AND sets the DWELL in seconds -- the pause
   after a line finishes typing, not a fixed period, so a long line is never cut
   short. For a display with no keyboard in front of it. */
const AUTO_DEFAULT = 10;          // README quotes this number -- change both
let autoOn = false, autoSecs = AUTO_DEFAULT, autoTimer = null;
/* The type-on runs ALWAYS. It deliberately does not consult
   prefers-reduced-motion: that flag is how you turn off window transitions and
   other OS fidgeting, and it has no business deciding whether a terminal prints
   its line. ?type=0 is the explicit off switch for anyone who wants one. */
let typeOn = true;
const autoBtn = document.getElementById("auto");

function paintAuto() {
  autoBtn.textContent = (autoOn ? "[X] " : "[ ] ") + LANGS[current].auto;
  autoBtn.setAttribute("aria-pressed", autoOn ? "true" : "false");
}

/* Self-rescheduling from the end of serve() rather than a standing interval:
   a manual "One more" (or space, or a language switch) therefore resets the
   clock instead of stacking a second timer or cutting the new line short. */
function scheduleAuto() {
  clearTimeout(autoTimer);
  if (autoOn) autoTimer = setTimeout(serve, autoSecs * 1000);
}

autoBtn.addEventListener("click", () => {
  autoOn = !autoOn;
  paintAuto();
  try { localStorage.setItem("cookieAuto", autoOn ? "1" : "0"); } catch (e) {}
  scheduleAuto();
});

function setLang(code, save = true) {
  current = code;
  const cfg = LANGS[code];
  document.documentElement.lang = code;
  document.title = cfg.title;
  const more = document.getElementById("more");
  const tagline = document.getElementById("tagline");
  more.textContent = cfg.more;
  tagline.textContent = cfg.tagline;
  const home = document.getElementById("homeLink");
  const readme = document.getElementById("readmeLink");
  home.textContent = cfg.home;
  // "README" is jargon -- a visitor doesn't know it's the story of a 1996 DOS
  // program. Ask the question they'd actually ask, in their own language.
  readme.textContent = cfg.readmeLabel;
  readme.href = cfg.readme;
  // stamp lang so the Thai strings pick up the real Thai font (see CSS)
  more.lang = tagline.lang = home.lang = readme.lang = autoBtn.lang = code;
  paintAuto();
  document.querySelectorAll(".langs button").forEach(b =>
    b.classList.toggle("active", b.dataset.lang === code));
  if (save) try { localStorage.setItem("cookieLang", code); } catch (e) {}
  serve();
}

document.querySelectorAll(".langs button").forEach(b =>
  b.addEventListener("click", () => setLang(b.dataset.lang)));
document.getElementById("more").addEventListener("click", serve);
addEventListener("keydown", e => {
  if (e.code === "Space" && !e.repeat) { e.preventDefault(); serve(); }
});

/* pick a start language: ?lang= beats the saved choice beats the browser.
   Same precedence for the autocycle, and it must settle BEFORE setLang --
   setLang serves a line, and serving a line arms the next one. */
(function () {
  const params = new URLSearchParams(location.search);
  const a = params.get("auto");
  if (a !== null) {
    autoOn = a !== "0";
    const secs = parseFloat(a);
    if (secs > 1) autoSecs = secs;      // ?auto=20 -> dwell 20s on each line
  } else {
    try { autoOn = localStorage.getItem("cookieAuto") === "1"; } catch (e) {}
  }

  const t = params.get("type");
  if (t !== null) {
    typeOn = t !== "0";
    try { localStorage.setItem("cookieType", typeOn ? "1" : "0"); } catch (e) {}
  } else {
    try {
      const saved = localStorage.getItem("cookieType");
      if (saved !== null) typeOn = saved === "1";
    } catch (e) {}
  }

  const q = params.get("lang");
  let saved = null;
  try { saved = localStorage.getItem("cookieLang"); } catch (e) {}
  const nav = (navigator.languages || [navigator.language || "en"])
    .map(l => l.slice(0, 2).toLowerCase()).find(l => LANGS[l]);
  setLang(LANGS[q] ? q : LANGS[saved] ? saved : nav || "en", false);
})();

console.log("fanheller: -- Liket of Goto10, ~1996");
